server {
  listen 80;
  server_name www.jhcode33.com;

  # 인증 파일 생성 경로 설정 (Certbot)
  location /.well-known/acme-challenge {
    root /var/www/certbot/;
  }
  
  # HTTP 요청을 HTTPS로 리디렉션
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name www.jhcode33.com;

  ssl_certificate /etc/letsencrypt/live/www.jhcode33.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.jhcode33.com/privkey.pem;

  location / {
    proxy_pass http://nextjs-notion-blog:3000; # HTTP 명시
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
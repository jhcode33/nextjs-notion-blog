global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

  external_labels:
    monitor: 'home-server-monitoring'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter_home_server'
    static_configs:
      - targets: ['192.168.0.155:9100']
        labels:
          instance: 'home-server'

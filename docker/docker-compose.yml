version: "3.3"

networks:
  nextjs-notion-blog:
    external: true

services:
  nextjs-notion-blog:
    container_name: nextjs-notion-blog
    image: jhcode33/nextjs-notion-blog:${TAG}
    networks:
      - nextjs-notion-blog
    expose:
      - "3000"
    depends_on:
      - redis
    restart: always